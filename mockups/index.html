<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redot Digital — Design Mockups</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 40px 20px; }
  h1 { text-align: center; margin-bottom: 40px; font-size: 24px; color: #333; }
  .grid { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 320px; cursor: pointer; transition: transform 0.2s; text-decoration: none; display: block; }
  .card:hover { transform: translateY(-4px); }
  .card img { width: 100%; height: 200px; object-fit: cover; object-position: top; }
  .card-label { padding: 16px; }
  .card-label h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #111; }
  .card-label p { font-size: 13px; color: #666; }
  .preview-frame { width: 100%; height: 200px; border: none; pointer-events: none; transform-origin: top left; }
  .frame-wrap { width: 100%; height: 200px; overflow: hidden; position: relative; }
</style>
</head>
<body>
<h1>Redot Digital — 3 Design Directions</h1>
<div class="grid">
  <a class="card" href="mockup-a.html" target="_blank">
    <div class="frame-wrap">
      <iframe class="preview-frame" src="mockup-a.html" style="transform: scale(0.4); width: 250%; height: 250%;"></iframe>
    </div>
    <div class="card-label">
      <h2>Option A — Minimal / Japanese</h2>
      <p>White space, serif accents, calm and refined</p>
    </div>
  </a>
  <a class="card" href="mockup-b.html" target="_blank">
    <div class="frame-wrap">
      <iframe class="preview-frame" src="mockup-b.html" style="transform: scale(0.4); width: 250%; height: 250%;"></iframe>
    </div>
    <div class="card-label">
      <h2>Option B — Bold / Dark Mode</h2>
      <p>High contrast, gradient accents, startup energy</p>
    </div>
  </a>
  <a class="card" href="mockup-c.html" target="_blank">
    <div class="frame-wrap">
      <iframe class="preview-frame" src="mockup-c.html" style="transform: scale(0.4); width: 250%; height: 250%;"></iframe>
    </div>
    <div class="card-label">
      <h2>Option C — Professional / B2B</h2>
      <p>Corporate trust signals, clean structure, enterprise-ready</p>
    </div>
  </a>
</div>
</body>
</html>
